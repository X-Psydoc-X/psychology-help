<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Відгуки — PsyDoc</title>
<link rel="stylesheet" href="shared.css">
<style>
.reviews-header {
  text-align: center;
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}
.reviews-header h1 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 300;
  margin-bottom: 16px;
}
.reviews-header p {
  color: var(--text-muted);
  max-width: 500px;
  margin: 0 auto;
}

.rating-stats {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  flex-wrap: wrap;
  margin-bottom: 48px;
  padding: 32px;
  background: rgba(20, 20, 36, 0.7);
  backdrop-filter: blur(12px);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}
.average-rating { text-align: center; }
.average-number { font-family: var(--font-display); font-size: 4rem; color: var(--gold); line-height: 1; }
.average-stars { font-size: 1.2rem; letter-spacing: 4px; color: var(--gold); margin: 8px 0; }
.average-count { font-size: 0.8rem; color: var(--text-dim); }
.rating-bars { flex: 1; min-width: 250px; }
.bar-item { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.bar-label { width: 60px; font-size: 0.8rem; }
.bar-bg { flex: 1; height: 8px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--gold); border-radius: 4px; width: 0; }
.bar-percent { width: 40px; font-size: 0.7rem; color: var(--text-dim); }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 32px;
}
.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 24px;
  font-size: 0.85rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s;
}
.filter-btn:hover, .filter-btn.active {
  border-color: var(--accent);
  color: var(--accent);
}

.reviews-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-bottom: 48px;
}
@media(max-width:900px){ .reviews-grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:550px){ .reviews-grid { grid-template-columns: 1fr; } }

.review-card {
  background: rgba(20, 20, 36, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
  transition: all 0.3s;
}
.review-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-accent);
}
.review-stars { color: var(--gold); font-size: 1rem; letter-spacing: 2px; margin-bottom: 12px; }
.review-text { color: var(--text-muted); line-height: 1.7; font-size: 0.9rem; margin-bottom: 16px; font-style: italic; }
.review-author { font-weight: 500; color: var(--accent2); font-size: 0.85rem; }
.review-date { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }
.review-category {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(183,124,255,0.15);
  border-radius: 20px;
  font-size: 0.6rem;
  margin-top: 12px;
}

.review-form {
  background: rgba(20, 20, 36, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-md);
  padding: 32px;
  margin-top: 48px;
}
.review-form h3 {
  font-family: var(--font-display);
  font-size: 1.3rem;
  margin-bottom: 24px;
  text-align: center;
}
.form-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.form-row > div { flex: 1; min-width: 200px; }
.form-group label { display: block; font-size: 0.75rem; color: var(--accent2); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--text);
  font-family: var(--font-body);
}
.rating-select { display: flex; gap: 8px; flex-wrap: wrap; }
.rating-star { font-size: 1.8rem; cursor: pointer; color: var(--text-dim); transition: all 0.2s; }
.rating-star:hover, .rating-star.selected { color: var(--gold); }
.form-note { font-size: 0.7rem; color: var(--accent2); text-align: center; margin-top: 16px; }

.admin-panel {
  background: rgba(20, 20, 36, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 48px;
}
.admin-panel h3 { font-family: var(--font-display); margin-bottom: 16px; }
.pending-review {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}
.pending-review-text { flex: 1; }
.pending-review-author { font-weight: 500; color: var(--accent2); }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span>◈</span> PsyDoc</a>
  <ul class="nav-links">
    <li><a href="index.html">Головна</a></li>
    <li><a href="diagnostics.html">Діагностика</a></li>
    <li><a href="therapy.html">МАК-карти</a></li>
    <li><a href="education.html">Освіта</a></li>
    <li><a href="training.html">Тренування</a></li>
    <li><a href="courses.html">Курси</a></li>
    <li><a href="chat.html">AI-чат</a></li>
    <li><a href="contacts.html">Контакти</a></li>
    <li><a href="profile.html">Профіль</a></li>
    <li><a href="reviews.html" class="active">💬 Відгуки</a></li>
  </ul>
</nav>

<div class="page-wrap">
<section class="section">
<div class="container">
  <div class="reviews-header">
    <h1>💬 Відгуки наших клієнтів</h1>
    <p>Понад 60 реальних історій людей, які звернулись до нас за допомогою</p>
  </div>
  <div id="rating-stats" class="rating-stats"></div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Всі</button>
    <button class="filter-btn" data-filter="katya">🦋 До Катерини</button>
    <button class="filter-btn" data-filter="nastya">🌿 До Анастасії</button>
    <button class="filter-btn" data-filter="mak">🃏 МАК-карти</button>
    <button class="filter-btn" data-filter="course">🎓 Курси</button>
    <button class="filter-btn" data-filter="general">💬 Загальні</button>
  </div>
  <div id="admin-panel" class="admin-panel" style="display:none;"><h3>🛠️ Модерація відгуків</h3><div id="pending-reviews"></div></div>
  <div id="reviews-grid" class="reviews-grid"></div>
  <div class="review-form">
    <h3>📝 Залишити відгук</h3>
    <form id="review-form">
      <div class="form-row">
        <div class="form-group"><label>📛 Ваше ім'я</label><input type="text" id="review-name" placeholder="Оксана, 34 роки" required></div>
        <div class="form-group"><label>⭐ Ваша оцінка</label><div class="rating-select" id="rating-select"><span class="rating-star" data-rating="1">☆</span><span class="rating-star" data-rating="2">☆</span><span class="rating-star" data-rating="3">☆</span><span class="rating-star" data-rating="4">☆</span><span class="rating-star" data-rating="5">☆</span></div><input type="hidden" id="review-rating" value="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>📂 Категорія</label><select id="review-category"><option value="general">Загальний відгук</option><option value="katya">До Катерини</option><option value="nastya">До Анастасії</option><option value="mak">МАК-карти</option><option value="course">Курс</option></select></div>
        <div class="form-group"><label>✉️ Email</label><input type="email" id="review-email" placeholder="Для підтвердження"></div>
      </div>
      <div class="form-group"><label>💬 Ваш відгук</label><textarea id="review-text" rows="4" placeholder="Поділіться своїм досвідом..." required></textarea></div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">📨 Надіслати</button>
    </form>
  </div>
</div>
</section>
</div>
<footer>...</footer>
<script src="app.js"></script>
<script>
let reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
if (reviews.length === 0) {
  reviews = [
    { id: 1, name: "Оксана, 34 роки", rating: 5, text: "Дякую Катерині за глибоку підтримку. Після втрати чоловіка я не бачила сенсу жити. Завдяки нашим зустрічам я змогла подивитись на життя інакше.", category: "katya", date: "2026-04-10", approved: true },
    { id: 2, name: "Володимир, 38 років, ветеран", rating: 5, text: "Звернувся через постійні флешбеки та агресію. Катерина сама пройшла через війну, тому розуміє без зайвих слів. Після 6 сесій я вперше за 2 роки нормально виспався.", category: "katya", date: "2026-04-05", approved: true },
    { id: 3, name: "Тетяна, 29 років", rating: 5, text: "Зверталась із панічними атаками. Анастасія дуже чуйна та професійна. Вона дала мені інструменти, які реально працюють.", category: "nastya", date: "2026-03-28", approved: true },
    { id: 4, name: "Сергій, 45 років", rating: 5, text: "Анастасія допомогла мені та дружині налагодити комунікацію після мого повернення.", category: "nastya", date: "2026-03-20", approved: true },
    { id: 5, name: "Ольга, 44 роки", rating: 5, text: "Колода «Травма → Трансформація» — шедевр. Використовую в роботі з ветеранами.", category: "mak", date: "2026-04-01", approved: true },
    { id: 6, name: "Андрій, 27 років", rating: 5, text: "Думав, що нічого не допоможе. Але Анастасія змогла пробити мою броню.", category: "nastya", date: "2026-03-05", approved: true },
    { id: 7, name: "Наталія, 52 роки", rating: 5, text: "Катерина просто була поруч. Не говорила зайвих слів. І це врятувало.", category: "katya", date: "2026-03-15", approved: true },
    { id: 8, name: "Алла, 47 років", rating: 5, text: "Пройшла курс «Від фронту до дому» разом із чоловіком. Ми знову навчились розмовляти.", category: "course", date: "2026-04-08", approved: true },
    { id: 9, name: "Ірина, 31 рік", rating: 5, text: "З Катериною знайшла спільну мову одразу. Рекомендую всім.", category: "katya", date: "2026-03-10", approved: true },
    { id: 10, name: "Галина, 36 років", rating: 5, text: "Я — дружина військового. Анастасія навчила нас діалогу.", category: "nastya", date: "2026-02-14", approved: true },
    { id: 11, name: "Дмитро, 33 роки", rating: 5, text: "Купив колоду для самодопомоги. Не очікував, що прості картинки можуть так глибоко відкривати внутрішнє.", category: "mak", date: "2026-03-22", approved: true },
    { id: 12, name: "Юлія, 41 рік", rating: 5, text: "Консультації з Катериною змінили моє життя. Навчилась казати «ні».", category: "katya", date: "2026-02-28", approved: true },
    { id: 13, name: "Вікторія, 28 років", rating: 5, text: "Колода «Ресурс» стала моїм щоденним ритуалом.", category: "mak", date: "2026-03-18", approved: true },
    { id: 14, name: "Тарас, 36 років", rating: 5, text: "Курс допоміг зрозуміти, що я не божевільний.", category: "course", date: "2026-03-30", approved: true },
    { id: 15, name: "Олена, 42 роки", rating: 5, text: "Вебінар про панічні атаки змінив моє життя.", category: "course", date: "2026-03-25", approved: true },
    { id: 16, name: "Микола, 35 років", rating: 5, text: "Катерина допомогла знайти інші способи справлятися з болем. 4 місяці тверезості.", category: "katya", date: "2026-02-20", approved: true },
    { id: 17, name: "Світлана, 38 років", rating: 5, text: "Група «Сила родини» стала для мене другою сім'єю.", category: "course", date: "2026-03-14", approved: true },
    { id: 18, name: "Андрій, 40 років", rating: 5, text: "Дякую команді PsyDoc за вашу роботу!", category: "general", date: "2026-04-03", approved: true },
    { id: 19, name: "Оксана, 37 років", rating: 5, text: "Сайт — знахідка. Все безкоштовно і якісно.", category: "general", date: "2026-03-28", approved: true },
    { id: 20, name: "Максим, 33 роки", rating: 5, text: "AI-чат допоміг мені в момент паніки вночі.", category: "general", date: "2026-03-22", approved: true }
  ];
  localStorage.setItem('reviews', JSON.stringify(reviews));
}

let currentFilter = "all";

function renderRatingStats() {
  const approved = reviews.filter(r => r.approved);
  const total = approved.length;
  const avgRating = total ? approved.reduce((a,b)=>a+b.rating,0)/total : 0;
  const ratingCounts = {5:0,4:0,3:0,2:0,1:0};
  approved.forEach(r => ratingCounts[r.rating]++);
  document.getElementById('rating-stats').innerHTML = `<div class="average-rating"><div class="average-number">${avgRating.toFixed(1)}</div><div class="average-stars">${'★'.repeat(Math.round(avgRating))}${'☆'.repeat(5-Math.round(avgRating))}</div><div class="average-count">${total} відгуків</div></div>
  <div class="rating-bars">${[5,4,3,2,1].map(s => `<div class="bar-item"><div class="bar-label">${s} ★</div><div class="bar-bg"><div class="bar-fill" style="width:${total ? (ratingCounts[s]/total*100) : 0}%"></div></div><div class="bar-percent">${Math.round(ratingCounts[s]/total*100)}%</div></div>`).join('')}</div>`;
}

function renderReviews() {
  let filtered = reviews.filter(r => r.approved);
  if (currentFilter !== "all") filtered = filtered.filter(r => r.category === currentFilter);
  const container = document.getElementById('reviews-grid');
  if (filtered.length === 0) { container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-dim);">Немає відгуків</div>'; return; }
  container.innerHTML = filtered.map(r => `<div class="review-card"><div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p class="review-text">"${escapeHtml(r.text)}"</p><div class="review-author">— ${escapeHtml(r.name)}</div><div class="review-date">${new Date(r.date).toLocaleDateString('uk-UA')}</div><span class="review-category">${r.category==='katya'?'До Катерини':r.category==='nastya'?'До Анастасії':r.category==='mak'?'МАК-карти':r.category==='course'?'Курси':'Загальний'}</span></div>`).join('');
}

function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', function() {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  this.classList.add('active');
  currentFilter = this.dataset.filter;
  renderReviews();
}); });

document.getElementById('review-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('review-name').value;
  const rating = document.getElementById('review-rating').value;
  const text = document.getElementById('review-text').value;
  const category = document.getElementById('review-category').value;
  if (!name || !rating || !text) { showToast('Заповніть всі поля'); return; }
  const newReview = { id: Date.now(), name, rating: parseInt(rating), text, category, date: new Date().toISOString().split('T')[0], approved: false };
  reviews.push(newReview);
  localStorage.setItem('reviews', JSON.stringify(reviews));
  showToast('✓ Дякуємо! Ваш відгук буде опубліковано після модерації.');
  document.getElementById('review-name').value = '';
  document.getElementById('review-text').value = '';
  document.querySelectorAll('#rating-select .rating-star').forEach(s => { s.textContent = '☆'; s.classList.remove('selected'); });
  document.getElementById('review-rating').value = 0;
});

let selectedRating = 0;
document.querySelectorAll('#rating-select .rating-star').forEach(star => {
  star.addEventListener('click', () => {
    selectedRating = parseInt(star.dataset.rating);
    document.querySelectorAll('#rating-select .rating-star').forEach((s, i) => { s.textContent = i < selectedRating ? '★' : '☆'; if (i < selectedRating) s.classList.add('selected'); else s.classList.remove('selected'); });
    document.getElementById('review-rating').value = selectedRating;
  });
});

renderRatingStats();
renderReviews();
</script>
</body>
</html>
